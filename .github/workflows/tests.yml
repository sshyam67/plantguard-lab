name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: pip install Flask==3.1.1 Pillow==11.2.1 numpy==2.1.3 pytest==8.3.5
      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q
